# Release contract for the portable LEAP review tools.
#
# This file is the single declaration of what a release contains. The builder
# reads every source file out of Git at the commit pinned below - never out of a
# working tree - so a release is reproducible from this manifest alone and
# uncommitted work-in-progress can never reach a colleague's copy.
#
# Validated by codebase/portable_release/manifest.py before any staging happens.
# See docs/leap_review_tools.md for the release and rollback procedure.

schema_version = 1

[release]
name = "leap-review-tools"
version = "0.1.0"
description = """\
Portable Windows build of two LEAP review tools: the Common ESTO dashboard \
renderer, and the balance-review workbook builder. Runs without Python, Conda, \
Git, or a repository checkout."""

[runtime]
# The interpreter the release is built and tested against. The frozen package
# carries its own interpreter; this records what a rebuild needs.
python = ">=3.11,<3.14"
packages = [
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "plotly>=5.20",
    "pyinstaller>=6.0",
]

# ---------------------------------------------------------------------------
# Participating repositories
# ---------------------------------------------------------------------------
#
# `paths` allowlists whole Python modules only. Configuration, templates, and
# other assets go in [[config_assets]] so they can be replaced without a
# rebuild.
#
# Note on package __init__ files: `codebase/__init__.py` in leap_initialisation
# is a re-export hub that imports the LEAP COM API, Excel I/O, and the
# comparison stack. None of that is needed by the supported commands, and much
# of it cannot run off a modelling workstation. It is deliberately NOT
# allowlisted, which makes `codebase` an implicit namespace package (PEP 420) in
# the package. The empty sub-package __init__ files below are allowlisted as
# complete files so the regular sub-packages keep their normal import
# behaviour.

[repositories.leap_initialisation]
commit = "baaf1821989196d4e62f4970da0e8430ed94ad87"
stage_dir = "leap_initialisation"
on_sys_path = true
paths = [
    "codebase/configuration/__init__.py",
    "codebase/configuration/workflow_config.py",
    "codebase/functions/__init__.py",
    "codebase/functions/balance_review_workbook_builder.py",
    "codebase/functions/balance_review_workbooks.py",
    "codebase/utilities/__init__.py",
    "codebase/utilities/leap_balance_export_resolver.py",
    "codebase/utilities/output_paths.py",
    "codebase/portable_release/__init__.py",
    "codebase/portable_release/commands.py",
    "codebase/portable_release/mapping_chain_client.py",
    "codebase/portable_release/portable_main.py",
    "codebase/portable_release/provenance.py",
    "codebase/portable_release/runtime.py",
    "codebase/portable_release/validation.py",
    "codebase/portable_release/workspace.py",
]
# manifest.py, settings.py, build_release.py, and developer_launcher.py are
# maintainer-side only: nothing on a portable run's import path reaches them,
# and a colleague's copy has no repositories to configure or release to build.

# The dashboard modules are imported flat (``import common_esto_dashboard_data``),
# so `codebase/` is stripped when staging. That also keeps this repository's
# `codebase` package name from colliding with leap_initialisation's.
[repositories.leap_dashboard]
commit = "f5aaf94f72078e51d4932d0a4cfb2d1062c432be"
stage_dir = "leap_dashboard"
strip_prefix = "codebase"
on_sys_path = true
paths = [
    "codebase/common_esto_dashboard_data.py",
    "codebase/common_esto_dashboard_output_layout.py",
    "codebase/common_esto_dashboard_portable.py",
    "codebase/common_esto_dashboard_renderer.py",
]

# `mapping_tools` has no __init__.py in its own repository either; it works as
# an implicit namespace package here exactly as it does there.
[repositories.leap_mappings]
commit = "3787addfe38b4cce5b4961c8a29e4b8be580d56b"
stage_dir = "leap_mappings"
strip_prefix = "codebase"
on_sys_path = true
target = "main"
paths = [
    "codebase/mapping_tools/source_branch_preflight.py",
]

# The mapping-chain worker's own bundle (handover §1/§3.3): a second entry for
# the SAME checkout (source_key), staged as the real `codebase` package (no
# strip_prefix) under its own directory so `codebase.mapping_tools.x` absolute
# imports resolve inside the isolated worker executable. This is the 20ish
# module closure of parse_leap_balance_export / convert_leap_results_to_esto /
# apply_common_esto_structure / portable_mapping_chain, computed by walking
# their absolute `codebase.*` imports (ast-based, not hand-maintained by
# inspection - re-run that walk if the mapping chain's imports change).
[repositories.leap_mappings_worker]
commit = "8bd0fb627a5e23ca8244dfccdba3c26706078584"
stage_dir = "leap_mappings_worker"
source_key = "leap_mappings"
on_sys_path = true
target = "worker"
paths = [
    "codebase/__init__.py",
    "codebase/mapping_issue_exceptions.py",
    "codebase/portable_mapping_chain.py",
    "codebase/mapping_tools/apply_common_esto_structure.py",
    "codebase/mapping_tools/build_dataset_tree_structure.py",
    "codebase/mapping_tools/common_esto_output_contract.py",
    "codebase/mapping_tools/convert_leap_results_to_esto.py",
    "codebase/mapping_tools/dataset_registry.py",
    "codebase/mapping_tools/diagnostic_adapter_registry.py",
    "codebase/mapping_tools/hierarchy_subtotal_adapters.py",
    "codebase/mapping_tools/hierarchy_subtotal_contract.py",
    "codebase/mapping_tools/mapping_candidate_generation.py",
    "codebase/mapping_tools/mapping_sheet_registry.py",
    "codebase/mapping_tools/non_expanding_rollups.py",
    "codebase/mapping_tools/parse_leap_balance_export.py",
    "codebase/mapping_tools/result_storage.py",
    "codebase/mapping_tools/rollup_sheet_registry.py",
    "codebase/mapping_tools/source_branch_preflight.py",
    "codebase/mapping_tools/source_rollups.py",
    "codebase/mapping_tools/target_share_allocation.py",
    "codebase/mapping_tools/value_adapter_registry.py",
    "codebase/utilities/__init__.py",
    "codebase/utilities/leap_balance_export_resolver.py",
]

# ---------------------------------------------------------------------------
# External configuration assets
# ---------------------------------------------------------------------------
#
# Copied into the package's config/ directory, not embedded in the executable.
# Their SHA-256 values are recorded in the release report and re-hashed into
# every run manifest, so replacing one with an approved newer version changes
# the next run and is visible in that run's record.

[[config_assets]]
repository = "leap_dashboard"
path = "config/common_esto_dashboard/common_esto_dashboard_template.json"
dest = "dashboard/common_esto_dashboard_template.json"
role = "dashboard_template"
description = "Page rules, chart generation settings, and sign semantics."

[[config_assets]]
repository = "leap_dashboard"
path = "config/common_esto_dashboard/series_config.json"
dest = "dashboard/series_config.json"
role = "dashboard_series_config"
description = "Series labels, visible-series rules, and the economy list."

[[config_assets]]
repository = "leap_dashboard"
path = "config/common_esto_dashboard/code_colors.json"
dest = "dashboard/code_colors.json"
role = "dashboard_code_colors"
description = "Per-axis ESTO code colour map."

[[config_assets]]
repository = "leap_mappings"
path = "config/all_demand_aggregated_components.json"
dest = "mappings/all_demand_aggregated_components.json"
role = "all_demand_aggregated_components"
description = """\
Which demand sectors have no separately modelled LEAP detail per economy. \
Owned by leap_mappings; decides which sector pages are hidden."""

[[config_assets]]
repository = "leap_mappings"
path = "config/outlook_mappings_master.xlsx"
dest = "mappings/outlook_mappings_master.xlsx"
role = "outlook_mappings_master"
description = "The canonical LEAP-to-ESTO mapping workbook the mapping chain applies."

[[config_assets]]
repository = "leap_mappings"
path = "config/source_branch_fallback_rules.csv"
dest = "mappings/source_branch_fallback_rules.csv"
role = "source_branch_fallback_rules"
description = "Interim-branch fallback zeroing rules applied before mapping-chain conversion."

# ---------------------------------------------------------------------------
# Large read-only source data tables
# ---------------------------------------------------------------------------
#
# These are regenerated outputs of the mapping workbook and source tables, not
# of any model run (handover section 2), so they are pinned as data_assets
# rather than recomputed per run. `allow_untracked = true` because they are
# gitignored in leap_mappings; the release still records their SHA-256, so a
# rebuild is required whenever the mapping workbook changes (see release
# notes).

[[data_assets]]
repository = "leap_mappings"
path = "results/mapping_relationships/energy_balance_relationships.csv"
dest = "mapping_chain/energy_balance_relationships.csv"
role = "mapping_chain_relationships"
description = "LEAP-to-ESTO conversion relationships, a function of the mapping workbook."
allow_untracked = true

[[data_assets]]
repository = "leap_mappings"
path = "results/mapping_relationships/esto_results_exact_rows.csv.gz"
dest = "mapping_chain/esto_results_exact_rows.csv.gz"
role = "mapping_chain_esto_exact_rows"
description = "ESTO exact-row extract the mapping chain converts LEAP output against."
allow_untracked = true

[[data_assets]]
repository = "leap_mappings"
path = "results/mapping_relationships/ninth_results_converted_to_esto.csv.gz"
dest = "mapping_chain/ninth_results_converted_to_esto.csv.gz"
role = "mapping_chain_ninth_converted"
description = "9th-edition results converted to ESTO structure, a mapping-chain source table."
allow_untracked = true

[[data_assets]]
repository = "leap_mappings"
path = "results/common_esto/common_esto_rows.csv"
dest = "mapping_chain/common_esto_rows.csv"
role = "mapping_chain_common_esto_rows"
description = "Common ESTO row definitions the mapping-chain fast path applies."
allow_untracked = true

# ---------------------------------------------------------------------------
# Supported commands
# ---------------------------------------------------------------------------

[[commands]]
name = "balance-review"
summary = "Build the five-sheet balance-review workbook for one economy, scenario, and year."
input_mode = "existing_diagnostic_artifacts"
outputs = """\
One balance_review_<economy>_<scenario>_<year>.xlsx workbook, plus a run \
manifest and an input validation report, in a dated folder under output/."""

  [[commands.inputs]]
  key = "economy"
  kind = "file"
  description = "Economy code, for example 20_USA."

  [[commands.inputs]]
  key = "scenario"
  kind = "file"
  description = "Scenario name or code, for example Target or TGT."

  [[commands.inputs]]
  key = "year"
  kind = "file"
  description = "Four-digit review year, for example 2022."

  [[commands.inputs]]
  key = "balance_export_workbook"
  kind = "file"
  description = """\
The LEAP Energy Balance export workbook (.xlsx) these diagnostics were \
computed against. Export at Level 2 detail or deeper."""

  [[commands.inputs]]
  key = "diagnostics_directory"
  kind = "directory"
  description = """\
Folder holding leap_balance_source_review.csv and \
leap_balance_source_differences.csv (both required) and \
leap_balance_mapping_issues.csv (optional), produced by the balance-diagnostics \
step. That step reads a LEAP balance export against the ESTO and 9th-edition \
source tables (314 MB), so it runs in developer mode rather than in a release. \
A results update / supply reconciliation run is not involved."""

[[commands]]
name = "dashboard"
summary = "Render the Common ESTO comparison dashboard for one economy."
input_mode = "existing_common_esto_comparison_data"
outputs = """\
A dashboard folder with index.html, per-sector pages, Plotly chart bundles, \
chart_manifest.csv, and a run manifest, in a dated folder under output/."""

  [[commands.inputs]]
  key = "economy"
  kind = "file"
  description = "Economy code, for example 20_USA."

  [[commands.inputs]]
  key = "comparison_data_path"
  kind = "file"
  description = """\
common_esto_comparison_data.csv from the leap_mappings pipeline. This file is \
close to a gigabyte for the full economy set, so it is a run input rather than \
part of the package."""

  [[commands.inputs]]
  key = "common_rows_path"
  kind = "file"
  description = "common_esto_rows.csv from the same leap_mappings run."

[[commands]]
name = "dashboard-from-export"
summary = "Render the Common ESTO comparison dashboard for one economy from a LEAP balance export."
input_mode = "leap_balance_export"
outputs = """\
A dashboard folder with index.html, per-sector pages, Plotly chart bundles, \
chart_manifest.csv, and a run manifest, in a dated folder under output/."""

  [[commands.inputs]]
  key = "economy"
  kind = "file"
  description = "Economy code, for example 20_USA."

  [[commands.inputs]]
  key = "export_dir"
  kind = "directory"
  description = """\
Folder of LEAP Energy Balance export workbooks (.xlsx) for this economy. \
Defaults to input/leap balances exports/<ECONOMY>/ when not given. Runs the \
leap_mappings mapping chain (a separate bundled executable, see the handover's \
architecture decision) to produce Common ESTO comparison data before \
rendering."""

  [[commands.inputs]]
  key = "comparison_data_path"
  kind = "file"
  required = false
  description = """\
Escape hatch: supply an existing common_esto_comparison_data.csv (with \
common_rows_path) to skip the mapping chain entirely and behave like the \
`dashboard` command."""

  [[commands.inputs]]
  key = "common_rows_path"
  kind = "file"
  required = false
  description = "Paired with comparison_data_path for the escape hatch."
